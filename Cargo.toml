[package]
name = "sky-recovery"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded backup manifest creation and verification CLI"

[[bin]]
name = "sky-recovery"
path = "src/main.rs"

[lib]
name = "sky_recovery"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
